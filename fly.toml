# Single instance on purpose: rooms live in memory, so a second machine would split players.
# Secrets (ALLOWED_ORIGINS) are NOT set here: use `fly secrets set`. See docs/DEPLOY.md.
app = "chessweeper-server"
primary_region = "sin"
kill_signal = "SIGTERM"
kill_timeout = "5s"

[build]
  dockerfile = "apps/server/Dockerfile"

[env]
  PORT = "8080"
  HOST = "0.0.0.0"
  TRUST_PROXY = "1"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 800
    hard_limit = 1000

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
